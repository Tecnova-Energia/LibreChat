name: Sync with upstream

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        run: gh repo sync Tecnova-Energia/LibreChat --source danny-avila/LibreChat --branch main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}