name: Daily Redeploy

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump deploy date
        run: |
          echo "$(date -u +%Y-%m-%d)" > DEPLOY_DATE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DEPLOY_DATE
          git commit -m "chore: daily redeploy $(date -u +%Y-%m-%d)"
          git push
